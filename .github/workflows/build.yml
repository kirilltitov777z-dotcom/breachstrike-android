name: Build Breach Strike APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate real HD assets (textures + audio)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          python3 tools/gen_assets.py --out app/src/main/assets

      - name: Report asset size
        run: du -sh app/src/main/assets && find app/src/main/assets -type f | wc -l

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 50000000 ]; then
            echo "APK is smaller than 50 MB"; exit 1
          fi
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk')
          assets = [n for n in z.namelist() if n.startswith('assets/')]
          total = sum(z.getinfo(n).file_size for n in assets)
          print('assets files:', len(assets), 'uncompressed:', round(total/1048576, 1), 'MB')
          assert len(assets) > 40, 'asset pack missing'
          assert z.testzip() is None
          print('APK zip OK')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BreachStrike-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Breach Strike build ${{ github.run_number }}
          body: |
            Breach Strike — мобильный FPS в духе Standoff 2 / CS.
            Установка: скачай APK, разреши установку из неизвестных источников.
            Пакет: com.breachstrike.game
          files: app/build/outputs/apk/debug/app-debug.apk
