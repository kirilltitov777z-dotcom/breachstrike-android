apply plugin: 'com.android.application'

android {
    namespace 'com.breachstrike.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.breachstrike.game'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'wav'
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
